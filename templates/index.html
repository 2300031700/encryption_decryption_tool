<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Steganography Encryption</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            border-radius: 10px;
            border: none;
            padding: 10px;
            font-size: 14px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: #00c6ff;
            background: linear-gradient(to right, #0072ff, #00c6ff);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        .output {
            margin-top: 10px;
            font-size: 13px;
            opacity: 0.9;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            opacity: 0.6;
            font-size: 13px;
        }

        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Encrypt Card -->
        <div class="card">
            <h2>🔐 Encrypt Message</h2>
            <form method="post">
                <textarea name="message" placeholder="Enter message to encrypt..."></textarea>
                <button name="action" value="encrypt">Encrypt & Hide Key</button>
            </form>

            <div class="output">
                <b>Encrypted Output:</b><br>
                <textarea readonly>{{ encrypted }}</textarea>
            </div>
        </div>

        <!-- Decrypt Card -->
        <div class="card">
            <h2>🔓 Decrypt Message</h2>
            <form method="post">
                <textarea name="encrypted" placeholder="Paste encrypted message..."></textarea>
                <button name="action" value="decrypt">Decrypt</button>
            </form>

            <div class="output">
                <b>Decrypted Message:</b><br>
                <textarea readonly>{{ decrypted }}</textarea>
            </div>
        </div>

    </div>

    <footer>
        Secure Steganography Encryption • Local Demo
    </footer>

</body>
</html>
